/* タイトル */
h1 {

  padding: 18px 50px;
  font-size: 24px;
  border-radius: 40px;
  background: #00ffff;
  color: #000;
  border: none;
  cursor: pointer;
}

/* SNS展開 */
.sns-links {
  display: none;
  margin-top: 20px;
}

.sns-links a {
  display: inline-block;
  margin: 10px;
  padding: 12px 25px;
  background: #00ffff;
  color: #000;
