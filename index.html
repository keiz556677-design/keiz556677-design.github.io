<!DOCTYPE html>

<meta charset="UTF-8">

<title>慶【Kei】OFFICIAL SITE</title>

<style>
body {
  background: linear-gradient(180deg, #0d0d0d, #001a1a);
  color: #fff;
  text-align: center;
  font-family: Arial, sans-serif;
  margin: 0;
}

/* タイトル */
h1 {
  margin-top: 40px;
  font-size: 36px;
  text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
}

/* プロフィール画像 */
.profile-img {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  margin-top: 30px;
  object-fit: cover;
  box-shadow: 0 0 30px #00ffff;
}

/* 見出し */
.section-title {
  margin-top: 70px;
  border-bottom: 2px solid #00ffff;
  display: inline-block;
  padding-bottom: 5px;
  text-shadow: 0 0 10px #00ffff;
}

/* プロフィール文章 */
.profile-text {
  max-width: 650px;
  margin: 25px auto;
  line-height: 1.8;
}

/* MV画像 */
.mv-img {
  width: 380px;
  max-width: 90%;
  margin-top: 25px;
  border-radius: 10px;
  box-shadow: 0 0 30px #00ffff;
}

/* 他の楽曲ボタン（丸くならない専用） */
.music-btn {
  display: inline-block;
  margin: 30px;
  padding: 14px 30px;
  background: linear-gradient(45deg, #00ffff, #00cccc);
  color: #000;
  text-decoration: none;
  border-radius: 30px;
  font-weight: bold;
  box-shadow: 0 0 25px #00ffff;
}

/* SNS */
.sns-area {
  margin-top: 70px;
}

.sns-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: 12px;
  padding: 12px 24px;
  background: linear-gradient(45deg, #00ffff, #00cccc);
  color: #000;
  text-decoration: none;
  border-radius: 30px;
  font-weight: bold;
  box-shadow: 0 0 25px #00ffff;
}

.sns-btn img {
  width: 22px;
  height: 22px;
}

/* 🔥 スマホ */
@media (max-width: 600px) {

  h1 {
    font-size: 26px;
  }

  .profile-img {
    width: 130px;
    height: 130px;
  }

  .profile-text {
    font-size: 14px;
    padding: 0 15px;
  }

  .mv-img {
    width: 95%;
  }

  /* SNS縦並び */
  .sns-area {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* SNS丸アイコン */
  .sns-btn {
    width: 70px;
    height: 70px;
    padding: 0;
    justify-content: center;
    border-radius: 50%;
  }

  /* 文字消す */
  .sns-text {
    display: none;
  }

  .sns-btn img {
    width: 30px;
    height: 30px;
  }
}
</style>
</head>
