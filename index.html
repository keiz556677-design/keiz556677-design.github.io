<!DOCTYPE html>

<meta charset="UTF-8">

<title>慶【Kei】OFFICIAL SITE</title>

<style>
body{
  background:linear-gradient(180deg,#0d0d0d,#001a1a);
  color:#fff;
  text-align:center;
  font-family:Arial,sans-serif;
  margin:0;
}

/* MENU */
.menu{
  position:fixed;
  top:15px;
  right:15px;
  z-index:1000;
}

.menu-btn{
  background:linear-gradient(45deg,#00ffff,#00cccc);
  color:#000;
  border:none;
  border-radius:25px;
  padding:10px 18px;
  font-weight:bold;
  box-shadow:0 0 20px #00ffff;
  cursor:pointer;
}

.menu-list{
  display:none;
  margin-top:10px;
  background:#001a1a;
  border:1px solid #00ffff;
  border-radius:12px;
  box-shadow:0 0 20px #00ffff;
  padding:10px;
}

.menu.active .menu-list{
  display:block;
}

.menu-list a{
  display:block;
  padding:10px;
  color:#fff;
  text-decoration:none;
}

/* タイトル */
h1{
  margin-top:40px;
  font-size:36px;
  text-shadow:0 0 20px #00ffff;
}

/* プロフィール */
.profile-img{
  width:180px;
  height:180px;
  border-radius:50%;
  margin-top:30px;
  object-fit:cover;
  box-shadow:0 0 30px #00ffff;
}

.profile-area{
  margin-top:120px;
}

/* 見出し */
.section-title{
  margin-bottom:25px;
  border-bottom:2px solid #00ffff;
  display:inline-block;
  padding-bottom:5px;
  text-shadow:0 0 15px #00ffff;
}

.profile-text{
  max-width:650px;
  margin:0 auto;
  line-height:1.8;
}

/* Musicタイトル */
.music-title{
  margin-top:90px;
  margin-bottom:25px;
  border-bottom:2px solid #00ffff;
  display:inline-block;
  padding-bottom:5px;
  text-shadow:0 0 15px #00ffff;
}

/* MV */
.mv-img{
  width:380px;
  max-width:90%;
  margin-top:10px;
  border-radius:10px;
  box-shadow:0 0 30px #00ffff;
}

/* 光るボタン */
.music-btn{
  display:inline-block;
  margin:15px;
  padding:14px 30px;
  background:linear-gradient(45deg,#00ffff,#00cccc);
  color:#000;
  text-decoration:none;
  border-radius:30px;
  font-weight:bold;
  box-shadow:0 0 10px #00ffff, 0 0 20px #00ffff;
  transition:0.3s;
}

.music-btn:hover{
  box-shadow:0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 60px #00ffff;
  transform:scale(1.05);
}

/* スマホ */
@media(max-width:600px){

  h1{
    font-size:26px;
    margin-top:80px;
  }

  .menu{
    top:20px;
    right:20px;
  }

  .profile-img{
    width:130px;
    height:130px;
  }

  .music-title{
    margin-top:70px;
    font-size:24px;
  }

  .music-btn{
    width:85%;
    box-sizing:border-box;
  }
}
</style>
