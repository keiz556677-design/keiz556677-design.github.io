<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SNSボタン</title>

<style>
body {
  background: linear-gradient(180deg, #001a1a, #000);
  text-align: center;
  color: #fff;
  font-family: Arial, sans-serif;
}

/* SNSタイトルをボタン化 */
.sns-main-btn {
  display: inline-block;
  margin-top: 80px;
  padding: 20px 60px;
  border-radius: 50px;
  background: linear-gradient(45deg, #00ffff, #00cccc);
  color: #000;
  text-decoration: none;
  font-size: 28px;
  font-weight: bold;
  box-shadow: 0 0 30px #00ffff;
  transition: 0.3s;
}

.sns-main-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 50px #00ffff;
}
</style>
</head>

<body>

<!-- 🔥 SNSまとめボタン -->
<a href="https://linktr.ee/" target="_blank" class="sns-main-btn">
  SNS
</a>

</body>
</html>
