<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>慶【Kei】OFFICIAL SITE</title>

<style>
body{
  background:linear-gradient(180deg,#0d0d0d,#001a1a);
  color:#fff;
  text-align:center;
  font-family:Arial,sans-serif;
  margin:0;
}

h1{
  margin-top:40px;
  font-size:36px;
  text-shadow:0 0 20px #00ffff;
}

/* 🔥 写真と下の余白 */
.profile-img{
  width:180px;
  height:180px;
  border-radius:50%;
  margin-top:30px;
  margin-bottom:50px; /* ←ここで余白 */
  object-fit:cover;
  box-shadow:0 0 30px #00ffff;
}

/* 🔥 Profileタイトルの余白 */
.section-title{
  margin-top:30px;
  margin-bottom:20px; /* ←ここも余白 */
  border-bottom:2px solid #00ffff;
  display:inline-block;
  padding-bottom:5px;
}

.profile-text{
  max-width:650px;
  margin:25px auto;
  line-height:1.8;
}

/* スマホ */
@media(max-width:600px){

  .profile-img{
    width:130px;
    height:130px;
    margin-bottom:40px; /* スマホでも余白 */
  }

  .section-title{
    margin-top:20px;
    margin-bottom:15px;
  }

}
</style>
</head>

<body>

<h1>慶【Kei】OFFICIAL SITE</h1>

<img src="https://raw.githubusercontent.com/keiz556677-design/keiz556677-design.github.io/main/%E6%85%B6channels4_profile.jpg" class="profile-img">

<h2 class="section-title">Profile</h2>

<p class="profile-text">
ここにプロフィール文章
</p>

</body>
</html>
